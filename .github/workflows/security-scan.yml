
name: Security Scan

on:
  push:
    branches:
      - "12.0/bugfixes"
  pull_request:
    branches:
      - "12.0/bugfixes"
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Trivy SCA, SBOM and Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # TRIVY - SCA
      - name: Trivy dependency vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,license
          format: sarif
          output: trivy-results.sarif

      # TRIVY - SBOM
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: glpi-sbom.cdx.json

      # SEMGREP - SAST
      - name: Install Semgrep
        run: pipx install semgrep

      - name: Run Semgrep SAST
        run: semgrep scan --config auto --sarif --output semgrep-results.sarif .

      # UPLOAD - TRIVY SARIF
      - name: Upload Trivy results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.39.5
        with:
          sarif_file: trivy-results.sarif
          category: trivy-sca

      # UPLOAD - SEMGREP SARIF
      - name: Upload Semgrep results
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.39.5
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-sast

      # SAVE SBOM
      - name: Upload SBOM artifact
        if: always() && hashFiles('glpi-sbom.cdx.json') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: glpi-sbom-cyclonedx
          path: glpi-sbom.cdx.json
          retention-days: 30
