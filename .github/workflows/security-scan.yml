
name: Security Scan

on:
  push:
    branches:
      - "12.0/bugfixes"
  pull_request:
    branches:
      - "12.0/bugfixes"
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Trivy SCA, SBOM and Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      # CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # 1. SBOM - COMPONENT INVENTORY AND VULNERABILITIES
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: cyclonedx
          output: glpi-sbom.cdx.json

      # 2. SCA - DEPENDENCY VULNERABILITIES AND LICENSES
      - name: Trivy SCA scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,license
          format: json
          output: glpi-sca-results.json

      # 3. SAST - SOURCE CODE ANALYSIS
      - name: Install Semgrep
        run: pipx install semgrep

      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config auto \
            --sarif \
            --output glpi-sast-results.sarif \
            .

      # GENERATE TRIVY SARIF
      - name: Generate Trivy SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,license
          format: sarif
          output: trivy-results.sarif

      # PUBLISH TRIVY RESULTS
      - name: Publish Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.39.5
        with:
          sarif_file: trivy-results.sarif
          category: trivy-sca

      # PUBLISH SEMGREP RESULTS
      - name: Publish Semgrep SARIF
        if: always() && hashFiles('glpi-sast-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.39.5
        with:
          sarif_file: glpi-sast-results.sarif
          category: semgrep-sast

      # ARTIFACT 1 - SBOM
      - name: Upload SBOM
        if: always() && hashFiles('glpi-sbom.cdx.json') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: glpi-sbom-cyclonedx
          path: glpi-sbom.cdx.json
          retention-days: 30

      # ARTIFACT 2 - SCA
      - name: Upload SCA report
        if: always() && hashFiles('glpi-sca-results.json') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: glpi-sca-report
          path: glpi-sca-results.json
          retention-days: 30

      # ARTIFACT 3 - SAST
      - name: Upload SAST report
        if: always() && hashFiles('glpi-sast-results.sarif') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: glpi-sast-report
          path: glpi-sast-results.sarif
          retention-days: 30
