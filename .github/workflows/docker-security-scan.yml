
name: Docker Security Scan

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

  push:
    branches:
      - "12.0/bugfixes"
    paths:
      - ".github/workflows/docker-security-scan.yml"
      - "docker-compose.yml"

permissions:
  contents: read

concurrency:
  group: docker-security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan Docker images
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: glpi
            image: dhi.io/glpi@sha256:ccc9e9abe66009e8467ec40840241fdf85c05d282b353445d5e00183e77050b0

          - name: mysql
            image: mysql:8.4

    steps:
      - name: Login to Docker Hardened Images registry
        if: matrix.name == 'glpi'
        uses: docker/login-action@v3.7.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Pull Docker image
        run: docker pull "${{ matrix.image }}"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          scanners: vuln,license
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          format: json
          output: docker-sca-results.json

      - name: Generate CycloneDX SBOM
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          scanners: vuln
          format: cyclonedx
          output: docker-sbom.cdx.json
          exit-code: '0'

      - name: Upload Docker SCA report
        if: always() && hashFiles('docker-sca-results.json') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docker-sca-${{ matrix.name }}
          path: docker-sca-results.json
          retention-days: 30

      - name: Upload Docker SBOM
        if: always() && hashFiles('docker-sbom.cdx.json') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docker-sbom-${{ matrix.name }}
          path: docker-sbom.cdx.json
          retention-days: 30
